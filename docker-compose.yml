# Local dev: databases and brokers are published on the host for tooling. For production,
# avoid exposing these ports publicly, use strong credentials, and set JWT_SECRET (and
# MERCADOPAGO_WEBHOOK_SECRET for payment webhooks) in a secrets manager or .env — never commit real values.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-product:
    image: mongo:7
    container_name: dl-orders-mongo-product
    ports:
      - "27017:27017"
    volumes:
      - dl-orders-mongo-product-data:/data/db
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-orders:
    image: mongo:7
    container_name: dl-orders-mongo-orders
    ports:
      - "27018:27017"
    volumes:
      - dl-orders-mongo-orders-data:/data/db
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-inventory:
    image: mongo:7
    container_name: dl-orders-mongo-inventory
    ports:
      - "27019:27017"
    volumes:
      - dl-orders-mongo-inventory-data:/data/db
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-notification:
    image: mongo:7
    container_name: dl-orders-mongo-notification
    ports:
      - "27020:27017"
    volumes:
      - dl-orders-mongo-notification-data:/data/db
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-payment:
    image: mongo:7
    container_name: dl-orders-mongo-payment
    ports:
      - "27021:27017"
    volumes:
      - dl-orders-mongo-payment-data:/data/db
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-orders:
    image: postgres:17
    container_name: dl-orders-postgres-orders
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dl_orders_svc
    ports:
      - "5432:5432"
    volumes:
      - dl-orders-postgres-orders-data:/var/lib/postgresql/data
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:17
    container_name: dl-orders-postgres-inventory
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dl_inventory_svc
    ports:
      - "5433:5432"
    volumes:
      - dl-orders-postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:17
    container_name: dl-orders-postgres-notification
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dl_notification_svc
    ports:
      - "5435:5432"
    volumes:
      - dl-orders-postgres-notification-data:/var/lib/postgresql/data
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:17
    container_name: dl-orders-postgres-auth
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dl_auth_svc
    ports:
      - "5436:5432"
    volumes:
      - dl-orders-postgres-auth-data:/var/lib/postgresql/data
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:17
    container_name: dl-orders-postgres-users
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dl_users_svc
    ports:
      - "5437:5432"
    volumes:
      - dl-orders-postgres-users-data:/var/lib/postgresql/data
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:17
    container_name: dl-orders-postgres-payment
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dl_payment_svc
    ports:
      - "5438:5432"
    volumes:
      - dl-orders-postgres-payment-data:/var/lib/postgresql/data
    networks:
      - dl-orders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: ./backend
      dockerfile: apps/orders/Dockerfile
    container_name: orders-service
    env_file:
      - ./backend/apps/orders/.env
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres-orders:5432/dl_orders_svc
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=orders_queue
      - MONGODB_URI=mongodb://mongo-orders:27017/dl_orders_audit
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET}
    depends_on:
      postgres-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-orders:
        condition: service_healthy
    networks:
      - dl-orders-network

  inventory-service:
    build:
      context: ./backend
      dockerfile: apps/inventory/Dockerfile
    container_name: inventory-service
    env_file:
      - ./backend/apps/inventory/.env
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres-inventory:5432/dl_inventory_svc
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=inventory_queue
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo-inventory:27017/dl_inventory_audit
    depends_on:
      postgres-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-inventory:
        condition: service_healthy
    networks:
      - dl-orders-network

  product-service:
    build:
      context: ./backend
      dockerfile: apps/product/Dockerfile
    container_name: product-service
    env_file:
      - ./backend/apps/product/.env
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongo-product:27017/dl_product_svc
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo-product:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dl-orders-network

  notification-service:
    build:
      context: ./backend
      dockerfile: apps/notification/Dockerfile
    container_name: notification-service
    env_file:
      - ./backend/apps/notification/.env
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres-notification:5432/dl_notification_svc
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=notification_queue
      - MONGODB_URI=mongodb://mongo-notification:27017/dl_notification_audit
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-notification:
        condition: service_healthy
    networks:
      - dl-orders-network

  auth-service:
    build:
      context: ./backend
      dockerfile: apps/auth/Dockerfile
    container_name: auth-service
    env_file:
      - ./backend/apps/auth/.env
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres-auth:5432/dl_auth_svc
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
      - OTP_EXPIRES_IN_MINUTES=10
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=auth_queue
      - REDIS_URL=redis://redis:6379
      - USERS_SERVICE_URL=http://users-service:3006
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-api-dl-orders}
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      users-service:
        condition: service_started
    networks:
      - dl-orders-network

  users-service:
    build:
      context: ./backend
      dockerfile: apps/users/Dockerfile
    container_name: users-service
    env_file:
      - ./backend/apps/users/.env
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@postgres-users:5432/dl_users_svc
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=users_queue
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-api-dl-orders}
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dl-orders-network

  payment-service:
    build:
      context: ./backend
      dockerfile: apps/payment/Dockerfile
    container_name: payment-service
    env_file:
      - ./backend/apps/payment/.env
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@postgres-payment:5432/dl_payment_svc
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=payment_queue
      - ORDERS_SERVICE_URL=http://orders-service:3001
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - MONGODB_URI=mongodb://mongo-payment:27017/dl_payment_audit
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-payment:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - dl-orders-network

volumes:
  dl-orders-mongo-product-data:
  dl-orders-mongo-orders-data:
  dl-orders-mongo-inventory-data:
  dl-orders-mongo-notification-data:
  dl-orders-mongo-payment-data:
  dl-orders-postgres-orders-data:
  dl-orders-postgres-inventory-data:
  dl-orders-postgres-notification-data:
  dl-orders-postgres-auth-data:
  dl-orders-postgres-users-data:
  dl-orders-postgres-payment-data:

networks:
  dl-orders-network:
    driver: bridge
